services:
  # 1. Core MySQL Relational Database
  db:
    restart: always
    ports: !reset [] # Completely drops public port exposure (3306) in production

  # 2. Redis Cache & Celery Task Broker
  redis:
    restart: always
    ports: !reset [] # Drops public port exposure (6379) in production

  # 3. Local Privacy-Compliant LLM Server (Ollama)
  ollama:
    restart: always
    ports: !reset [] # Drops public port exposure (11434) in production
    deploy:
      resources:
        limits:
          memory: 4G # Enforces the strict 4GB upper boundary for memory allocation
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # 4. Vector Database for RAG (ChromaDB)
  chroma:
    restart: always
    ports: !reset [] # Drops public port exposure (8001) in production

  # 5. Fast-API Backend Core Application
  api:
    restart: always
    # Removes local code mounting block so production containers run isolated code builds
    volumes: !reset []
    deploy:
      resources:
        limits:
          memory: 2G # Explicit 2GB memory headroom limitation

  # 6. Celery Asynchronous Background Task Worker
  worker:
    restart: always
    volumes: !reset [] # Drops local dev directory synchronization mount

  # 7. Reverse Proxy & Security Layer (Nginx)
  nginx:
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # Mounts your Let's Encrypt SSL paths into Nginx for HTTPS decryption handling
      - /etc/letsencrypt:/etc/letsencrypt:ro

  # 8. Performance Metrics Scraper (Prometheus)
  prometheus:
    restart: always

  # 9. Diagnostics Dashboard (Grafana)
  grafana:
    restart: always