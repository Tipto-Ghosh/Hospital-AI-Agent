# docker-compose-prod.yml
# Production overrides for hospital-ai-agent stack.
# Use together with the base docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose-prod.yml up -d

services:

  # ---- Core Services ----

  hospital-db:
    restart: always
    ports: !reset []                    # No direct host access to MySQL

  hospital-redis:
    restart: always
    ports: !reset []                    # No direct host access to Redis

  hospital-ollama:
    restart: always
    ports: !reset []                    # Ollama accessible only inside the network
    deploy:
      resources:
        limits:
          memory: 4G                   # Hard limit for the LLM container
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  hospital-chroma:
    restart: always
    ports: !reset []                    # ChromaDB not exposed to the host

  hospital-api:
    restart: always
    volumes: !reset []                  # No local code or chroma_data bind mount
    deploy:
      resources:
        limits:
          memory: 2G                   # API memory cap

  hospital-worker:
    restart: always
    volumes: !reset []                  # No local code sync

  # ---- Reverse Proxy ----

  hospital-nginx:
    restart: always
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro   # Mount actual Let's Encrypt certificates
      - ./nginx/logs:/var/log/nginx            # Persist access/error logs
    # Removes certbot-webroot and the ./nginx/certs dev mount

  # ---- Observability (always on in production) ----

  hospital-langfuse:
    restart: always
    profiles: !reset []                 # Removes the observability profile → always starts
    # Ensure you have set LANGFUSE_DATABASE_URL, LANGFUSE_NEXTAUTH_SECRET, LANGFUSE_SALT in .env

  hospital-prometheus:
    restart: always
    profiles: !reset []                 # Always start monitoring

  hospital-grafana:
    restart: always
    profiles: !reset []
    # Optionally, add a restricted host port if you need direct access:
    # ports:
    #   - "127.0.0.1:3001:3000"