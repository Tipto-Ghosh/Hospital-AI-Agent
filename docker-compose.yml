version: '3.8'

services:
  # 1. Core MySQL Relational Database
  db:
    image: mysql:8.0
    container_name: hospital_ai_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_DATABASE: hospital_ai
      MYSQL_USER: hospital_user
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_hospital_password
    secrets:
      - mysql_root_password
      - mysql_hospital_password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./data/seed:/docker-entrypoint-initdb.d
    networks:
      - hospital-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          memory: 1G
    healthcheck:
      # FIXED: Uses mysqladmin ping with the root password file to avoid authentication failure loops
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$(cat /run/secrets/mysql_root_password)"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis Cache & Celery Task Broker
  redis:
    image: redis:7-alpine
    container_name: hospital_ai_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 1gb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - hospital-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Local Privacy-Compliant LLM Server (Ollama)
  ollama:
    image: ollama/ollama:latest
    container_name: hospital_ai_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - hospital-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # 4. Vector Database for RAG (ChromaDB)
  chroma:
    image: chromadb/chroma:latest
    container_name: hospital_ai_chroma
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - chroma-data:/chroma/chroma  # FIXED: Target path corrected to standard internal Chroma storage
    networks:
      - hospital-network
    environment:
      - IS_PERSISTENT=TRUE

  # 5. Fast-API Backend Core Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hospital_ai_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # LANGSMITH CONFIG: Explicitly routes tracking to LangSmith
      - LANGCHAIN_TRACING_V2=true
      - LANGCHAIN_ENDPOINT=https://api.smith.langchain.com
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-hospital-ai-api}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    networks:
      - hospital-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 6. Celery Asynchronous Background Task Worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hospital_ai_worker
    restart: unless-stopped
    command: celery -A app.notifications.tasks worker --loglevel=info
    env_file:
      - .env
    environment:
      # LANGSMITH CONFIG: Ensures asynchronous tasks are also observed and tracked
      - LANGCHAIN_TRACING_V2=true
      - LANGCHAIN_ENDPOINT=https://api.smith.langchain.com
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-hospital-ai-worker}
    volumes:
      - .:/app
    networks:
      - hospital-network
    depends_on:
      redis:
        condition: service_healthy

  # 7. Reverse Proxy & Security Layer (Nginx)
  nginx:
    image: nginx:alpine
    container_name: hospital_ai_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - hospital-network
    depends_on:
      - api

  # 8. Performance Metrics Scraper (Prometheus)
  prometheus:
    image: prom/prometheus:latest
    container_name: hospital_ai_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - hospital-network

  # 9. Diagnostics Dashboard (Grafana)
  grafana:
    image: grafana/grafana:latest
    container_name: hospital_ai_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    networks:
      - hospital-network

secrets:
  mysql_root_password:
    file: ./secrets/mysql_root_password.txt
  mysql_hospital_password:
    file: ./secrets/mysql_hospital_password.txt

volumes:
  mysql-data:
  redis-data:
  ollama-models:
  chroma-data:

networks:
  hospital-network:
    driver: bridge