name: hospital-ai-agent

services:

  hospital-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hospital-api
    restart: unless-stopped
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./chroma_data:/app/chroma_data
    expose:
      - "8000"
    depends_on:
      hospital-db:
        condition: service_healthy
      hospital-redis:
        condition: service_healthy
    networks:
      - hospital-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  hospital-nginx:
    image: nginx:1.27-alpine
    container_name: hospital-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/logs:/var/log/nginx
      - certbot-webroot:/var/www/certbot:ro
    depends_on:
      hospital-api:
        condition: service_healthy
    networks:
      - hospital-internal
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  hospital-db:
    image: mysql:8.0
    container_name: hospital-db
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./data/seed:/docker-entrypoint-initdb.d:ro
    expose:
      - "3306"
    networks:
      - hospital-internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USER}", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  hospital-redis:
    image: redis:7-alpine
    container_name: hospital-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1
      --appendonly yes
    volumes:
      - redis-data:/data
    expose:
      - "6379"
    networks:
      - hospital-internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  hospital-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hospital-worker
    restart: unless-stopped
    command: celery -A app.notifications.tasks.celery_app worker --loglevel=info --concurrency=4
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      hospital-redis:
        condition: service_healthy
      hospital-db:
        condition: service_healthy
    networks:
      - hospital-internal

  hospital-chroma:
    image: chromadb/chroma:latest
    container_name: hospital-chroma
    restart: unless-stopped
    volumes:
      - chroma-data:/chroma/chroma
    expose:
      - "8001"
    networks:
      - hospital-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/v1/heartbeat"]
      interval: 30s
      timeout: 5s
      retries: 3

  hospital-ollama:
    image: ollama/ollama:latest
    container_name: hospital-ollama
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    expose:
      - "11434"
    networks:
      - hospital-internal
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    profiles:
      - gpu

  hospital-langfuse:
    image: langfuse/langfuse:latest
    container_name: hospital-langfuse
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=${LANGFUSE_DATABASE_URL}
      - NEXTAUTH_SECRET=${LANGFUSE_NEXTAUTH_SECRET}
      - SALT=${LANGFUSE_SALT}
      - NEXTAUTH_URL=http://hospital-langfuse:3000
      - TELEMETRY_ENABLED=false
    expose:
      - "3000"
    depends_on:
      hospital-db:
        condition: service_healthy
    networks:
      - hospital-internal
    profiles:
      - observability

  hospital-prometheus:
    image: prom/prometheus:latest
    container_name: hospital-prometheus
    restart: unless-stopped
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    expose:
      - "9090"
    networks:
      - hospital-internal
    profiles:
      - observability

  hospital-grafana:
    image: grafana/grafana:latest
    container_name: hospital-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://hospital-grafana:3001
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    expose:
      - "3001"
    depends_on:
      - hospital-prometheus
    networks:
      - hospital-internal
    profiles:
      - observability

networks:
  hospital-internal:
    driver: bridge
    internal: false

volumes:
  mysql-data:
  redis-data:
  chroma-data:
  ollama-models:
  prometheus-data:
  grafana-data:
  certbot-webroot: